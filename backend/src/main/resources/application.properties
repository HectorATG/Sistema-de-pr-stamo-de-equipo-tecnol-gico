spring.application.name=prestamos-backend
server.port=8080

# Base de datos H2 en memoria (se reinicia en cada arranque)
spring.datasource.url=jdbc:h2:mem:prestamosdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Consola de H2: http://localhost:8080/h2-console  (JDBC URL: jdbc:h2:mem:prestamosdb, usuario: sa, sin contraseña)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Mostrar el mensaje de error en las respuestas JSON
server.error.include-message=always
